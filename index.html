<!DOCTYPE html>

<!-- 
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-auto" lang="en"> <!-- Update`class="theme-auto" with your preference -->

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
        
    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>Kevin Gimbel's LittleLink</title>
    <link rel="icon" type="image/x-icon" href="/images/avatar.png"> <!-- Update this with your own favicon -->
    
    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta name="description" content="Kevin Gimbel is a Senior DevOps Engineer and hobby photographer">
    
    <!-- Keywords -->
    <meta name="keywords" content="Kevin Gimbel, DevOps, Cloud, Rust, Go">
    
    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <meta rel="canonical" href="https://me.keg.im">
    
    <!-- Author Information -->
    <meta name="author" content="Kevin Gimbel">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/brands.css">
  
    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended. 
         Remove comments if you've added LittleLink Extended dependencies -->

  </head>

<body>

    <div class="container">
        <div class="column">

            <!-- 
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
            <!-- <img class="avatar avatar--rounded" src="images/avatar.png" srcset="images/avatar@2x.png 2x" alt="LittleLink"> -->

            <!-- Replace with your name or brand -->
            <h1>
              Kevin Gimbel
            </h1>

            <!-- Add a short description about yourself or your brand -->
            <p>Senior Platform Engineeer & Amateur photographer<br>🎮 🎲 📸 🎞️ 🐦‍⬛ 📚 🧑‍💻 🏳️‍🌈 </p>

            <!-- All your buttons go here -->
            <div class="button-stack" role="navigation">

              <!-- Blog -->
              <a class="button button-default" href="https://kevingimbel.de/blog" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="Website Icon">Blog</a>

              <!-- Blog -->
              <a class="button button-default" href="https://kevingimbel.de/photoblog" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="Website Icon">Photo Blog</a>
              
              <!-- Mastodon -->
              <a class="button button-mastodon" href="https://gimbel.dev/@kevin" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/mastodon.svg" alt="Mastodon Logo">Mastodon</a>
              
              <!-- LinkedIn -->
              <a class="button button-linked" href="https://www.linkedin.com/in/kevingimbel/" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/linkedin.svg" alt="LinkedIn Logo">LinkedIn</a>

              <!-- GitHub -->
              <a class="button button-github" href="https://github.com/KevinGimbel" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/github.svg" alt="GitHub Logo">GitHub</a>

              <a class="button button-default" href="https://kevingimbel.de/bookshelf" target="_blank" rel="noopener" role="button"><img class="icon" aria-hidden="true" src="images/icons/generic-website.svg" alt="Website Icon">Bookshelf</a>

      </div>
        
      <!-- Feel free to add your own footer information, including updating `privacy.html` to reflect how your LittleLink fork is set up -->
      <footer>
        <small>Hosted on GitHub Pages | <a href="https://github.com/KevinGimbel/me.keg.im/tree/gh-pages" title="View Source code on GitHub">Source Code</a></small><br/>
        <small>Build your own by forking <a href="https://littlelink.io" target="_blank" rel="noopener">LittleLink</a></small>
      </footer>
    
    </div>
  </div>

</body>

</html>
